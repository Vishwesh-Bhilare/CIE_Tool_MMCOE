<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open & Short Circuit Lab – Network Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="network-analysis/css/network.css">
</head>
<body>
<div class="grid-bg"></div>

<nav>
  <a href="index.html" class="nav-logo">← DASHBOARD</a>
  <div class="nav-logo" style="color:#1B2CC1;">MODULE 04: OPEN/SHORT CIRCUIT</div>
</nav>

<div class="hud">
  <div class="hud-item student-name-display" style="color:#1B2CC1;">PLAYER</div>
  <div class="hud-item">SCORE: <span id="hud-score">0</span> XP</div>
  <div class="hud-item">LEVEL: <span id="hud-level">1</span></div>
  <div class="hud-timer" id="hud-timer">00:00</div>
</div>

<div class="lab-container">

  <div class="controls-panel">
    <div class="panel-title">Virtual Test Bench</div>

    <div class="mission-box">
      <h3>MISSION <span id="mission-status"></span></h3>
      <p id="mission-text">Configure the network for an <strong>Open Circuit</strong> test and calculate the <strong>Z₁₁</strong> parameter.</p>
    </div>

    <!-- Toggle Switch -->
    <div style="display:flex; justify-content:center; margin: 10px 0;">
      <button class="btn btn-secondary" id="btn-toggle" style="width:100%;">CURRENT: OPEN CIRCUIT</button>
    </div>

    <!-- Input for calculated Answer -->
    <div class="control-group" style="margin-top:15px;">
      <label>Enter Calculated Z₁₁ (Ω):</label>
      <input type="number" id="input-answer" style="background:#f1f5f9; border:1px solid #e2e8f0; color:#1B2CC1; font-family:'Space Mono'; font-size:1.2rem; padding:10px; border-radius:6px; outline:none; text-align:center;">
    </div>

    <div style="display:flex; gap:10px; margin-top:15px;">
      <button class="btn btn-primary" id="btn-submit" style="flex:1;">VERIFY ANSWER</button>
      <button class="btn btn-hint" id="btn-hint" style="flex:1;">GET HINT</button>
    </div>
  </div>

  <div class="simulation-area">
    <div class="canvas-container">
      <canvas id="circuitCanvas"></canvas>
    </div>
    <div id="feedback-panel" class="feedback-panel"></div>
  </div>

</div>

<script src="network-analysis/js/network-core.js"></script>
<script src="network-analysis/js/scoring.js?v=2"></script>
<script src="network-analysis/js/hints.js"></script>
<script src="network-analysis/js/open-short.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/db.js?v=9"></script>
<script src="js/auth.js"></script>
</body>
</html>
