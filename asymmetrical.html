<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asymmetrical Network Challenge – Network Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="network-analysis/css/network.css">
</head>
<body>
<div class="grid-bg"></div>

<nav>
  <a href="index.html" class="nav-logo">← DASHBOARD</a>
  <div class="nav-logo" style="color:#1B2CC1;">MODULE 05: ASYMMETRICAL NETWORK</div>
</nav>

<div class="hud">
  <div class="hud-item student-name-display" style="color:#1B2CC1;">PLAYER</div>
  <div class="hud-item">SCORE: <span id="hud-score">0</span> XP</div>
  <div class="hud-item">LEVEL: <span id="hud-level">1</span></div>
  <div class="hud-timer" id="hud-timer">00:00</div>
</div>

<div class="lab-container">

  <div class="controls-panel">
    <div class="panel-title">Pi-Network Balancer</div>

    <div class="mission-box">
      <h3>MISSION <span id="mission-status"></span></h3>
      <p id="mission-text">Transform the asymmetrical Pi-Network into a <strong>symmetrical</strong> one with Z₀ = <strong>300 Ω</strong>.</p>
    </div>

    <!-- Pi-Network Schematic SVG -->
    <svg width="100%" height="150" viewBox="0 0 300 150" style="background:#f1f5f9; border-radius:8px; border:1px solid #e2e8f0;">
      <!-- Input to Top -->
      <path d="M 20 40 L 80 40" stroke="rgba(27,44,193,0.5)" stroke-width="3" fill="none"/>
      <!-- Shunt ZA -->
      <path d="M 80 40 L 80 60 M 70 70 L 90 70 M 70 80 L 90 80 M 70 90 L 90 90 M 80 100 L 80 120" stroke="rgba(27,44,193,0.5)" id="path-za" stroke-width="3" fill="none"/>

      <!-- Series ZB -->
      <path d="M 80 40 L 100 40 L 110 30 L 130 50 L 150 30 L 170 50 L 190 30 L 200 40 L 220 40" stroke="rgba(27,44,193,0.5)" id="path-zb" stroke-width="3" fill="none"/>

      <!-- Shunt ZC -->
      <path d="M 220 40 L 220 60 M 210 70 L 230 70 M 210 80 L 230 80 M 210 90 L 230 90 M 220 100 L 220 120" stroke="rgba(27,44,193,0.5)" id="path-zc" stroke-width="3" fill="none"/>

      <!-- Output from Top -->
      <path d="M 220 40 L 280 40" stroke="rgba(27,44,193,0.5)" stroke-width="3" fill="none"/>

      <!-- Ground line -->
      <path d="M 20 120 L 280 120 M 140 125 L 160 125 M 145 130 L 155 130" stroke="rgba(27,44,193,0.5)" stroke-width="2" fill="none"/>

      <text x="30" y="85" fill="#091540" font-family="Space Mono" font-size="12">Zᴀ = <tspan id="lbl-za">100</tspan> Ω</text>
      <text x="110" y="20" fill="#091540" font-family="Space Mono" font-size="12">Zʙ = <tspan id="lbl-zb">200</tspan> Ω</text>
      <text x="240" y="85" fill="#091540" font-family="Space Mono" font-size="12">Zᴄ = <tspan id="lbl-zc">300</tspan> Ω</text>
    </svg>

    <div class="control-group">
      <label><span>Zᴀ (Input Shunt)</span> <span id="val-za" style="display:none;">100 Ω</span></label>
      <div class="number-input-group"><button type="button" class="btn-step" onclick="stepInputValue('slider-za', -1)">-</button><input type="number" id="slider-za" min="50" max="1000" step="10" value="100"><button type="button" class="btn-step" onclick="stepInputValue('slider-za', 1)">+</button></div>
    </div>

    <div class="control-group">
      <label><span>Zʙ (Series Arm)</span> <span id="val-zb" style="display:none;">200 Ω</span></label>
      <div class="number-input-group"><button type="button" class="btn-step" onclick="stepInputValue('slider-zb', -1)">-</button><input type="number" id="slider-zb" min="50" max="1000" step="10" value="200"><button type="button" class="btn-step" onclick="stepInputValue('slider-zb', 1)">+</button></div>
    </div>

    <div class="control-group">
      <label><span>Zᴄ (Output Shunt)</span> <span id="val-zc" style="display:none;">300 Ω</span></label>
      <div class="number-input-group"><button type="button" class="btn-step" onclick="stepInputValue('slider-zc', -1)">-</button><input type="number" id="slider-zc" min="50" max="1000" step="10" value="300"><button type="button" class="btn-step" onclick="stepInputValue('slider-zc', 1)">+</button></div>
    </div>

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn btn-primary" id="btn-submit" style="flex:1;">VERIFY NETWORK</button>
      <button class="btn btn-hint" id="btn-hint" style="flex:1;">GET HINT</button>
    </div>
  </div>

  <div class="simulation-area">
    <div class="canvas-container">
      <canvas id="balanceCanvas"></canvas>
    </div>
    <div id="feedback-panel" class="feedback-panel"></div>
  </div>

</div>

<script src="network-analysis/js/network-core.js"></script>
<script src="network-analysis/js/scoring.js?v=2"></script>
<script src="network-analysis/js/hints.js"></script>
<script src="network-analysis/js/asymmetrical.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/db.js?v=9"></script>
<script src="js/auth.js"></script>
</body>
</html>
