<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter Design Lab – Network Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="network-analysis/css/network.css">
</head>
<body>
<div class="grid-bg"></div>

<nav>
  <a href="index.html" class="nav-logo">← DASHBOARD</a>
  <div class="nav-logo" style="color:var(--accent);">MODULE 01: FILTER DESIGN LAB</div>
</nav>

<div class="hud">
  <div class="hud-item student-name-display" style="color:#00ff88;">PLAYER</div>
  <div class="hud-item">SCORE: <span id="hud-score">0</span> XP</div>
  <div class="hud-item">LEVEL: <span id="hud-level">1</span></div>
  <div class="hud-timer" id="hud-timer">00:00</div>
</div>

<div class="lab-container">
  
  <!-- Left Panel: Controls & Mission -->
  <div class="controls-panel">
    <div class="panel-title">RC Low-Pass Filter</div>
    
    <div class="mission-box">
      <h3>MISSION <span id="mission-status"></span></h3>
      <p id="mission-text">Design a low-pass filter with a cutoff frequency of <strong>1000 Hz</strong>.</p>
    </div>

    <!-- Circuit Schematic SVG -->
    <svg width="100%" height="120" viewBox="0 0 300 120" style="background:var(--surface2); border-radius:8px; border:1px solid rgba(255,255,255,0.05);">
      <path d="M 20 60 L 80 60 L 90 50 L 110 70 L 130 50 L 150 70 L 160 60 L 250 60" stroke="rgba(0,255,136,0.6)" stroke-width="3" fill="none"/>
      <path d="M 200 60 L 200 80" stroke="rgba(0,255,136,0.6)" stroke-width="3" fill="none"/>
      <path d="M 185 80 L 215 80" stroke="rgba(0,255,136,0.6)" stroke-width="3" fill="none"/>
      <path d="M 185 90 L 215 90" stroke="rgba(0,255,136,0.6)" stroke-width="3" fill="none"/>
      <path d="M 200 90 L 200 110" stroke="rgba(0,255,136,0.6)" stroke-width="3" fill="none"/>
      <!-- Ground -->
      <path d="M 190 110 L 210 110 M 195 115 L 205 115" stroke="rgba(0,255,136,0.6)" stroke-width="2" fill="none"/>
      <text x="120" y="40" fill="var(--accent)" font-family="Space Mono" font-size="12" text-anchor="middle">R = <tspan id="lbl-R">1000</tspan> Ω</text>
      <text x="230" y="88" fill="var(--accent)" font-family="Space Mono" font-size="12">C = <tspan id="lbl-C">0.1</tspan> µF</text>
      <text x="20" y="45" fill="var(--text)" font-family="Space Mono" font-size="12">Vin</text>
      <text x="260" y="45" fill="var(--text)" font-family="Space Mono" font-size="12">Vout</text>
      <circle cx="20" cy="60" r="4" fill="var(--text)"/>
      <circle cx="250" cy="60" r="4" fill="var(--text)"/>
      <circle cx="200" cy="60" r="4" fill="var(--text)"/>
    </svg>

    <div class="control-group">
      <label><span>Resistance (R) - O</span> <span id="val-R" style="display:none;">1000 Ω</span></label>
      <div class="number-input-group"><button type="button" class="btn-step" onclick="stepInputValue('slider-R', -1)">-</button><input type="number" id="slider-R" min="100" max="10000" step="10" value="1000"><button type="button" class="btn-step" onclick="stepInputValue('slider-R', 1)">+</button></div>
    </div>
    
    <div class="control-group">
      <label><span>Capacitance (C) - �F</span> <span id="val-C" style="display:none;">0.1 µF</span></label>
      <div class="number-input-group"><button type="button" class="btn-step" onclick="stepInputValue('slider-C', -1)">-</button><input type="number" id="slider-C" min="0.01" max="10" step="0.01" value="0.1"><button type="button" class="btn-step" onclick="stepInputValue('slider-C', 1)">+</button></div>
    </div>

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn btn-primary" id="btn-submit" style="flex:1;">SIMULATE & TEST</button>
      <button class="btn btn-hint" id="btn-hint" style="flex:1;">GET HINT</button>
    </div>

    <div class="control-group" style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.05); padding-top:15px;">
      <label>Real-time Calculation:</label>
      <div style="font-family:'Orbitron', monospace; font-size:1.4rem; color:var(--text); text-align:center; padding:10px 0;">
        f<sub>c</sub> = <span id="val-fc" style="display:none;">1591.5</span> Hz
      </div>
    </div>
    
  </div>

  <!-- Right Panel: Canvas & Feedback -->
  <div class="simulation-area">
    <div class="canvas-container">
      <canvas id="bodeCanvas"></canvas>
    </div>

    <div id="feedback-panel" class="feedback-panel">
      <!-- Injected by JS -->
    </div>
  </div>

</div>

<!-- Core Scripts -->
<script src="network-analysis/js/network-core.js"></script>
<script src="network-analysis/js/scoring.js?v=2"></script>
<script src="network-analysis/js/hints.js"></script>
<script src="network-analysis/js/filters.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="js/db.js?v=8"></script>
<script src="js/auth.js"></script>
</body>
</html>
