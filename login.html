<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - Physics Game Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a12;
    --surface: #0a1424;
    --surface2: #122036;
    --text: #e0f2fe;
    --muted: #64748b;
    --accent: #00ff88;
    --accent-glow: rgba(0, 255, 136, 0.4);
    --border: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-image:
      linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
  }

  .login-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow);
    position: relative;
    overflow: hidden;
  }

  .login-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: var(--accent);
    box-shadow: 0 0 15px var(--accent);
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    margin-bottom: 10px;
    color: var(--accent);
    font-size: 1.8rem;
    letter-spacing: 2px;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 30px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.85rem;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 15px;
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    border-radius: 4px;
    transition: all 0.3s ease;
    outline: none;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #050a12;
    border: none;
    padding: 15px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 10px;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px var(--accent-glow);
  }

  .btn:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }

  .auth-tabs {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 999px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 24px;
    padding: 6px;
  }

  .auth-tab {
    background: transparent;
    border: none;
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 10px;
    text-transform: uppercase;
  }

  .auth-tab.active {
    background: var(--accent);
    color: #050a12;
    box-shadow: 0 0 15px var(--accent-glow);
  }

  .auth-message {
    border-radius: 6px;
    font-size: 0.82rem;
    line-height: 1.4;
    margin-bottom: 18px;
    padding: 12px;
  }

  .auth-message[hidden] {
    display: none;
  }

  .auth-message.error {
    background: rgba(255, 51, 102, 0.12);
    border: 1px solid rgba(255, 51, 102, 0.45);
    color: #ff99b6;
  }

  .auth-message.success {
    background: rgba(0, 255, 136, 0.12);
    border: 1px solid rgba(0, 255, 136, 0.45);
    color: var(--accent);
  }

  .auth-help {
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.5;
    margin-top: 16px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="login-container">
  <h1>SYSTEM ACCESS</h1>
  <div class="subtitle">PHYSICS GAME LAB</div>

  <div class="auth-tabs" role="tablist" aria-label="Authentication options">
    <button type="button" class="auth-tab active" data-auth-tab="login" role="tab" aria-selected="true" onclick="switchAuthTab('login')">Log In</button>
    <button type="button" class="auth-tab" data-auth-tab="signup" role="tab" aria-selected="false" onclick="switchAuthTab('signup')">Sign Up</button>
  </div>

  <div id="authMessage" class="auth-message" hidden></div>

  <form id="loginForm" onsubmit="loginStudent(event)">
    <div class="form-group">
      <label for="loginEmail">Email ID</label>
      <input id="loginEmail" name="email" type="email" placeholder="student@mmcoe.edu.in" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Log In</button>
  </form>

  <form id="signupForm" onsubmit="signupStudent(event)" hidden>
    <div class="form-group">
      <label for="signupName">Full Name</label>
      <input id="signupName" name="fullName" type="text" placeholder="Your full name" autocomplete="name" required>
    </div>
    <div class="form-group">
      <label for="signupEmail">Email ID</label>
      <input id="signupEmail" name="email" type="email" placeholder="student@mmcoe.edu.in" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="signupPassword">Password</label>
      <input id="signupPassword" name="password" type="password" placeholder="Minimum 6 characters" autocomplete="new-password" required minlength="6">
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter password" autocomplete="new-password" required minlength="6">
    </div>
    <button type="submit" class="btn">Create Account</button>
  </form>

  <p class="auth-help">Google sign-in is disabled. Use your MMCOE email ID and password to access the lab.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/db.js?v=9"></script>
<script src="js/auth.js"></script>
</body>
</html>
