<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - Physics Game Lab</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-dark: #091540;
    --primary-blue: #1B2CC1;
    --accent-blue: #7692FF;
    --light-blue: #ABD2FA;
    --bg: #FFFFFF;
    --success: #16a34a;
    --warning: #f59e0b;
    --error: #dc2626;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    color: var(--primary-dark);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .login-container {
    background: #FFFFFF;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 4px 24px rgba(9,21,64,0.10);
    position: relative;
    overflow: hidden;
  }

  .login-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: var(--primary-blue);
  }

  h1 {
    font-family: 'DM Sans', sans-serif;
    text-align: center;
    margin-bottom: 10px;
    color: var(--primary-dark);
    font-size: 1.8rem;
    letter-spacing: 2px;
  }

  .subtitle {
    text-align: center;
    color: #6b7280;
    font-size: 0.9rem;
    margin-bottom: 30px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.85rem;
    color: var(--primary-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  input {
    width: 100%;
    background: #FFFFFF;
    border: 1px solid #e2e8f0;
    color: var(--primary-dark);
    padding: 12px 15px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    border-radius: 4px;
    transition: all 0.3s ease;
    outline: none;
  }

  input:focus {
    border-color: var(--primary-blue);
  }

  .btn {
    width: 100%;
    background: var(--primary-blue);
    color: #FFFFFF;
    border: none;
    padding: 15px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 10px;
  }

  .btn:hover:not(:disabled) {
    background: #152299;
  }

  .btn:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }

  .auth-tabs {
    background: transparent;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 24px;
    padding: 6px;
  }

  .auth-tab {
    background: transparent;
    border: none;
    border-radius: 999px;
    color: #6b7280;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 10px;
    text-transform: uppercase;
  }

  .auth-tab.active {
    background: var(--primary-blue);
    color: #FFFFFF;
  }

  .auth-message {
    border-radius: 6px;
    font-size: 0.82rem;
    line-height: 1.4;
    margin-bottom: 18px;
    padding: 12px;
  }

  .auth-message[hidden] {
    display: none;
  }

  .auth-message.error {
    background: #fee2e2;
    border: 1px solid #fca5a5;
    color: var(--error);
  }

  .auth-message.success {
    background: #dcfce7;
    border: 1px solid #86efac;
    color: var(--success);
  }

  .auth-help {
    color: #6b7280;
    font-size: 0.78rem;
    line-height: 1.5;
    margin-top: 16px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="login-container">
  <h1>SYSTEM ACCESS</h1>
  <div class="subtitle">PHYSICS GAME LAB</div>

  <div class="auth-tabs" role="tablist" aria-label="Authentication options">
    <button type="button" class="auth-tab active" data-auth-tab="login" role="tab" aria-selected="true" onclick="switchAuthTab('login')">Log In</button>
    <button type="button" class="auth-tab" data-auth-tab="signup" role="tab" aria-selected="false" onclick="switchAuthTab('signup')">Sign Up</button>
  </div>

  <div id="authMessage" class="auth-message" hidden></div>

  <form id="loginForm" onsubmit="loginStudent(event)">
    <div class="form-group">
      <label for="loginEmail">Email ID</label>
      <input id="loginEmail" name="email" type="email" placeholder="student@mmcoe.edu.in" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Log In</button>
  </form>

  <form id="signupForm" onsubmit="signupStudent(event)" hidden>
    <div class="form-group">
      <label for="signupName">Full Name</label>
      <input id="signupName" name="fullName" type="text" placeholder="Your full name" autocomplete="name" required>
    </div>
    <div class="form-group">
      <label for="signupEmail">Email ID</label>
      <input id="signupEmail" name="email" type="email" placeholder="student@mmcoe.edu.in" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="signupPassword">Password</label>
      <input id="signupPassword" name="password" type="password" placeholder="Minimum 6 characters" autocomplete="new-password" required minlength="6">
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter password" autocomplete="new-password" required minlength="6">
    </div>
    <button type="submit" class="btn">Create Account</button>
  </form>

  <p class="auth-help">Google sign-in is disabled. Use your MMCOE email ID and password to access the lab.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/db.js?v=9"></script>
<script src="js/auth.js"></script>
</body>
</html>
