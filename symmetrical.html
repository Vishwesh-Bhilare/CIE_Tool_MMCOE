<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symmetrical Network Challenge – Network Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="network-analysis/css/network.css">
</head>
<body>
<div class="grid-bg"></div>

<nav>
  <a href="index.html" class="nav-logo">← DASHBOARD</a>
  <div class="nav-logo" style="color:var(--accent);">MODULE 02: SYMMETRICAL NETWORK</div>
</nav>

<div class="hud">
  <div class="hud-item student-name-display" style="color:#00ff88;">PLAYER</div>
  <div class="hud-item">SCORE: <span id="hud-score">0</span> XP</div>
  <div class="hud-item">LEVEL: <span id="hud-level">1</span></div>
  <div class="hud-timer" id="hud-timer">00:00</div>
</div>

<div class="lab-container">

  <div class="controls-panel">
    <div class="panel-title">T-Network Balancer</div>

    <div class="mission-box">
      <h3>MISSION <span id="mission-status"></span></h3>
      <p id="mission-text">Make the network <strong>symmetrical</strong> and achieve a characteristic impedance (Z₀) of <strong>500 Ω</strong>.</p>
    </div>

    <!-- Circuit Schematic SVG -->
    <svg width="100%" height="150" viewBox="0 0 300 150" style="background:var(--surface2); border-radius:8px; border:1px solid rgba(255,255,255,0.05);">
      <!-- Input to Z1 -->
      <path d="M 20 50 L 80 50 L 90 40 L 110 60 L 130 40 L 140 50 L 150 50" stroke="rgba(0,255,136,0.6)" id="path-z1" stroke-width="3" fill="none"/>
      <!-- Z1 to Z2 -->
      <path d="M 150 50 L 160 50 L 170 40 L 190 60 L 210 40 L 220 50 L 280 50" stroke="rgba(0,255,136,0.6)" id="path-z2" stroke-width="3" fill="none"/>
      <!-- Shunt Z3 -->
      <path d="M 150 50 L 150 70 M 140 80 L 160 80 M 140 90 L 160 90 M 140 100 L 160 100 M 150 110 L 150 130" stroke="rgba(0,255,136,0.6)" id="path-z3" stroke-width="3" fill="none"/>

      <!-- Ground line -->
      <path d="M 20 130 L 280 130 M 140 135 L 160 135 M 145 140 L 155 140" stroke="rgba(0,255,136,0.6)" stroke-width="2" fill="none"/>

      <text x="110" y="30" fill="var(--text)" font-family="Space Mono" font-size="12">Z₁ = <tspan id="lbl-z1">100</tspan> Ω</text>
      <text x="190" y="30" fill="var(--text)" font-family="Space Mono" font-size="12">Z₂ = <tspan id="lbl-z2">200</tspan> Ω</text>
      <text x="175" y="95" fill="var(--text)" font-family="Space Mono" font-size="12">Z₃ = <tspan id="lbl-z3">100</tspan> Ω</text>

      <text x="20" y="35" fill="var(--muted)" font-family="Space Mono" font-size="10">PORT 1</text>
      <text x="240" y="35" fill="var(--muted)" font-family="Space Mono" font-size="10">PORT 2</text>
    </svg>

    <div class="control-group">
      <label><span>Z₁ (Series Arm 1)</span> <span id="val-z1" style="display:none;">100 Ω</span></label>
      <div class="number-input-group"><button type="button" class="btn-step" onclick="stepInputValue('slider-z1', -1)">-</button><input type="number" id="slider-z1" min="10" max="1000" step="10" value="100"><button type="button" class="btn-step" onclick="stepInputValue('slider-z1', 1)">+</button></div>
    </div>

    <div class="control-group">
      <label><span>Z₂ (Series Arm 2)</span> <span id="val-z2" style="display:none;">200 Ω</span></label>
      <div class="number-input-group"><button type="button" class="btn-step" onclick="stepInputValue('slider-z2', -1)">-</button><input type="number" id="slider-z2" min="10" max="1000" step="10" value="200"><button type="button" class="btn-step" onclick="stepInputValue('slider-z2', 1)">+</button></div>
    </div>

    <div class="control-group">
      <label><span>Z₃ (Shunt Arm)</span> <span id="val-z3" style="display:none;">100 Ω</span></label>
      <div class="number-input-group"><button type="button" class="btn-step" onclick="stepInputValue('slider-z3', -1)">-</button><input type="number" id="slider-z3" min="10" max="1000" step="10" value="100"><button type="button" class="btn-step" onclick="stepInputValue('slider-z3', 1)">+</button></div>
    </div>

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn btn-primary" id="btn-submit" style="flex:1;">VERIFY NETWORK</button>
      <button class="btn btn-hint" id="btn-hint" style="flex:1;">GET HINT</button>
    </div>
  </div>

  <div class="simulation-area">
    <div class="canvas-container">
      <canvas id="balanceCanvas"></canvas>
    </div>
    <div id="feedback-panel" class="feedback-panel"></div>
  </div>

</div>

<script src="network-analysis/js/network-core.js"></script>
<script src="network-analysis/js/scoring.js?v=2"></script>
<script src="network-analysis/js/hints.js"></script>
<script src="network-analysis/js/symmetrical.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/db.js?v=9"></script>
<script src="js/auth.js"></script>
</body>
</html>
