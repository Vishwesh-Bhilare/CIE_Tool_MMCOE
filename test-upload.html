<!DOCTYPE html>
<html>
<head>
    <title>Photo Compression Test</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f3f4f6; color: #1f2937; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        .btn { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; }
        .btn:hover { background: #1d4ed8; }
        img { max-width: 100%; margin-top: 20px; border: 2px solid #e5e7eb; border-radius: 4px; }
        .stats { margin-top: 20px; font-weight: bold; font-size: 1.1rem; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Photo Compression Test</h2>
        <p style="color:#6b7280; margin-bottom:20px;">Take a massive photo with your phone or select a large image file. This script will intercept it, crush the file size, and show you exactly what will be sent to the database.</p>
        
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
        <button class="btn" onclick="document.getElementById('fileInput').click()">📷 SELECT A PHOTO TO COMPRESS</button>
        
        <div class="stats" id="stats"></div>
        <img id="preview" style="display:none;">
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const originalSize = (file.size / 1024).toFixed(2);
            document.getElementById('stats').innerHTML = Original Size: \ KB... Compressing...;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000;
                    
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Compress to JPEG at 60% quality
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    
                    // Calculate new size (Base64 is roughly 4/3 the size of binary)
                    const base64Length = dataUrl.length - 'data:image/jpeg;base64,'.length;
                    const compressedSize = ((base64Length * 3 / 4) / 1024).toFixed(2);
                    
                    document.getElementById('stats').innerHTML = \
                        Original Size: <span style="color:#dc2626">\ KB</span><br>
                        Compressed Size: <span style="color:#16a34a">\ KB</span><br>
                        <span style="color:#2563eb; font-size:0.9rem;">(This compressed image can safely fit inside the text database!)</span>
                    \;
                    
                    const preview = document.getElementById('preview');
                    preview.src = dataUrl;
                    preview.style.display = 'block';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
